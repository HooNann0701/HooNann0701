name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # mỗi ngày 0h UTC (7h sáng VN)
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          # BẮT BUỘC
          token: ${{ secrets.METRICS_TOKEN }}  
          filename: github-metrics.svg

          # GIAO DIỆN CHUNG
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh

          # PLUGIN: lịch contribution dạng 3D isometric
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year   # hoặc half-year

          # PLUGIN: ngôn ngữ 
          plugin_languages: yes
          plugin_languages_ignored: html, css, shaderlab
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          # PLUGIN: thói quen code (giờ nào, ngày nào) 
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
